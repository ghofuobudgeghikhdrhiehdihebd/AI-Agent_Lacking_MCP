[package]
name = "agent-no-mcp-rust"
version = "0.1.0"
edition = "2024"
description = "Rust translation of the agent_no_mcp Python AI agent"
default-run = "agent-no-mcp-rust"

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rmp-serde = "1.3.1"
rmpv = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
serialport = "4.10.1"
tiny_http = "0.12.0"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "rebuild-prompt"
path = "src/bin/rebuild_prompt.rs"
